<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
  <a-assets>
    <img id="skyTexture" src="unsplash-equirec.jpg">
    <img id="dolphinTexture" src="marbletext-small.jpg">
    <img id="boatTexture" src="boattext-small.jpg">
  </a-assets>

  //boat
<a-entity id="boat" position="-1 0 -6">
  <a-box position="0 0.25 0" width="3" height="0.5" depth="1" src="#boatTexture"></a-box>
  <a-cylinder position="0 1.5 0" radius="0.05" height="2" color="#5C3317"></a-cylinder>
  <a-triangle vertex-a="0.05 2.4 0" vertex-b="0.05 0.7 0" vertex-c="1.3 0.7 0"
              color="#FFFFFF" side="double"></a-triangle>
  <a-plane position="-0.2 2.5 0" width="0.4" height="0.25" color="#EF2D5E" side="double"></a-plane>
</a-entity>

//dolphin
<a-entity id="dolphin" position="-4 -1 -6">

  <a-sphere radius="0.5" scale="1.6 0.6 0.6" src="#dolphinTexture"></a-sphere>
  <a-cone position="-1 0 0" rotation="0 0 90"
          radius-bottom="0.12" radius-top="0.05" height="0.4" src="#dolphinTexture"></a-cone>

  <a-cone position="0.05 0.35 0" rotation="0 0 -20" scale="1 1 0.3"
          radius-bottom="0.15" radius-top="0" height="0.4" src="#dolphinTexture"></a-cone>

  <a-triangle vertex-a="0.75 0 0" vertex-b="1.2 0 0.4" vertex-c="1.2 0 -0.4"
              src="#dolphinTexture" side="double"></a-triangle>
  <a-sphere position="-0.6 0.08 0.19" radius="0.04" color="#000000"></a-sphere>
  <a-sphere position="-0.6 0.08 -0.19" radius="0.04" color="#000000"></a-sphere>
</a-entity>


  <a-sky src="#skyTexture"></a-sky>
</a-scene>

  </body>
</html>
