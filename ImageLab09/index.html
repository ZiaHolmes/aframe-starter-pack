<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="0 3.2 -5" radius=".5" color="white"></a-sphere>
      <a-sphere position="0 2.3 -5" radius=".75" color="white"></a-sphere>
      <a-sphere position="0 1 -5" radius="1" color="white"></a-sphere>

      <a-sphere position="0 1.5 -4" radius=".1" color="black"></a-sphere>
      <a-sphere position="0 2.1 -4" radius=".1" color="black"></a-sphere>
      <a-sphere position="0 2.5 -4" radius=".1" color="black"></a-sphere>

      <a-sphere position="-.2 3 -4" radius=".07" color="black"></a-sphere>
      <a-sphere position=".2 3 -4" radius=".07" color="black"></a-sphere>

      <a-triangle color="orange" position="-.2 3 -4" vertex-a="0.2 0 0" vertex-b="0.15 -0.1 0" vertex-c="0.4 -0.2 0"></a-triangle>

      <a-cylinder color="black" position="0 3.8 -5" height="0.4" radius="0.2"></a-cylinder>
      <a-cylinder color="black" position="0 3.6 -5" height="0.01" radius="0.5"></a-cylinder>

      <a-plane position="0 0.1 -4" rotation="-90 0 0" width="4" height="4" color="white"></a-plane>
      <a-sky color="blue"></a-sky>
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: forest; dressingAmount: 900"></a-entity>
    </a-scene>
  </body>
</html>
