<a-entity id="house" position="4 2.23 -12" rotation="0 270 0" scale="5 5 5"
          obj-model="obj: #houseModel; mtl: #houseMtl">
</a-entity>

<a-entity id="rabbit1" position="3.4 -1 -5.8" rotation="0 -30 0">
